name: Update Core with new SharedKernel version

env:
  NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
  NUGET_PASSWORD: ${{ secrets.NUGET_PASSWORD }}
  NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
  DOTNET_VERSION: 8.0.x
  PACKAGE_EXSTENSION_NAME: nupkg
  PROJECT_PATH: ./Shared/KindPaws.Core
  PATH_TO_SLN: ./Shared/KindPaws.Core/KindPaws.Core.sln
  PATH_TO_CSPROJ: ./Shared/KindPaws.Core/KindPaws.Core.csproj
  PACKAGE_NAME: KindPaws.Core

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-core-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Authenticate with GitHub Packages
        run: >
          dotnet nuget add source
          ${{ secrets.NUGET_SOURCE }} --name github
          --username ${{ secrets.NUGET_USERNAME }} --password ${{ secrets.NUGET_PASSWORD }} --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore ${{ env.PATH_TO_SLN }}

      - name: Get current version of SharedKernel
        run: |
          CURRENT_VERSION=$(dotnet ${{ env.PROJECT_PATH }} list package --include-transitive | grep 'SharedKernel' | awk '{print $3}')
          echo "Current SharedKernel version: $CURRENT_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

      - name: Get latest version of SharedKernel from NuGet
        run: |
          LATEST_VERSION=$(dotnet nuget list SharedKernel --source ${{ env.NUGET_SOURCE }} | head -n 1 | awk '{print $2}')
          echo "Latest SharedKernel version: $LATEST_VERSION"
          echo "LATEST_VERSION=$LATEST_VERSION" >> $GITHUB_ENV

      - name: Check if SharedKernel version needs update
        run: |
          if [[ "$CURRENT_VERSION" != "$LATEST_VERSION" ]]; then
            echo "Updating SharedKernel version in Core project"
            dotnet add ${{ env.PATH_TO_CSPROJ }} package SharedKernel --version $LATEST_VERSION
            # Update Core version number (based on SharedKernel version update)
            NEW_CORE_VERSION=$(echo $LATEST_VERSION | sed 's/\([0-9]*\.[0-9]*\)\.[0-9]*$/\1/')
            echo "Updating Core version to $NEW_CORE_VERSION"
            sed -i '' 's/<Version>[0-9]*\.[0-9]*\.[0-9]*<\/Version>/<Version>'$NEW_CORE_VERSION'<\/Version>/' ${{ env.PATH_TO_CSPROJ }}
          else
            echo "No update needed"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Automated update: SharedKernel updated, Core version bumped"
          git push
