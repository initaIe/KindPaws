name: Build and Publish All NuGet Packages

env:
  NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
  NUGET_PASSWORD: ${{ secrets.NUGET_PASSWORD }}
  NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
  DOTNET_VERSION: 8.0.x
  PACKAGE_EXSTENSION_NAME: nupkg
  
  SHAREDKERNEL_SOLUTION_PATH: ./KindPaws.Shared/KindPaws.SharedKernel
  SHAREDKERNEL_PROJECT_PATH: ./KindPaws.Shared/KindPaws.SharedKernel/src/KindPaws.SharedKernel
  SHAREDKERNEL_PATH_TO_SLN: ./KindPaws.Shared/KindPaws.SharedKernel/KindPaws.SharedKernel.sln
  SHAREDKERNEL_PATH_TO_CSPROJ: ./KindPaws.Shared/KindPaws.SharedKernel/src/KindPaws.SharedKernel/KindPaws.SharedKernel.csproj  
  SHAREDKERNEL_PACKAGE_NAME: KindPaws.SharedKernel
  
  CORE_SOLUTION_PATH: ./KindPaws.Shared/KindPaws.Core
  CORE_PROJECT_PATH: ./KindPaws.Shared/KindPaws.Core/src/KindPaws.Core
  CORE_PATH_TO_SLN: ./KindPaws.Shared/KindPaws.Core/KindPaws.Core.sln
  CORE_PATH_TO_CSPROJ: ./KindPaws.Shared/KindPaws.Core/src/KindPaws.Core/KindPaws.Core.csproj  
  CORE_PACKAGE_NAME: KindPaws.Core
  
  FRAMEWORK_SOLUTION_PATH: ./KindPaws.Shared/KindPaws.Framework
  FRAMEWORK_PROJECT_PATH: ./KindPaws.Shared/KindPaws.Framework/src/KindPaws.Framework
  FRAMEWORK_PATH_TO_SLN: ./KindPaws.Shared/KindPaws.Framework/KindPaws.Framework.sln
  FRAMEWORK_PATH_TO_CSPROJ: ./KindPaws.Shared/KindPaws.Framework/src/KindPaws.Framework/KindPaws.Framework.csproj  
  FRAMEWORK_PACKAGE_NAME: KindPaws.Framework

on:
  push:
    branches:
      - Dev
    paths:
      - 'KindPaws.Shared/**/*'

jobs:
  sharedkernel:
    name: Build And Publish KindPaws.SharedKernel Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Authenticate with GitHub Packages
        run: >
          dotnet nuget add source
          ${{ secrets.NUGET_SOURCE }} --name github
          --username ${{ secrets.NUGET_USERNAME }} --password ${{ secrets.NUGET_PASSWORD }} --store-password-in-clear-text

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Restore dependencies
        run: dotnet restore ${{ env.SHAREDKERNEL_PATH_TO_SLN }}

      - name: Get version from .csproj
        id: version
        run: |
          VERSION=$(xmllint --xpath "string(//Project/PropertyGroup/Version)" ${{ env.SHAREDKERNEL_PATH_TO_CSPROJ }})
          echo "SHAREDKERNEL_PACKAGE_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build
        run: dotnet build ${{ env.SHAREDKERNEL_PATH_TO_SLN }} --configuration Release --no-restore

      - name: Pack NuGet package
        run: >
          dotnet pack ${{ env.SHAREDKERNEL_PATH_TO_SLN }} --no-restore --no-build --configuration Release -p:PackageVersion=${{ env.SHAREDKERNEL_PACKAGE_VERSION }} -p:PackageId=${{ env.SHAREDKERNEL_PACKAGE_NAME }}

      - name: Publish
        run: >
          dotnet nuget push ${{ env.SHAREDKERNEL_PROJECT_PATH }}/bin/Release/${{ env.SHAREDKERNEL_PACKAGE_NAME }}.${{ env.SHAREDKERNEL_PACKAGE_VERSION }}.${{ env.PACKAGE_EXSTENSION_NAME }}
          -s ${{ env.NUGET_SOURCE }}
          -k ${{ env.NUGET_PASSWORD }}
  
  
  core:
    name: Build And Publish KindPaws.Core Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Authenticate with GitHub Packages
        run: >
          dotnet nuget add source
          ${{ secrets.NUGET_SOURCE }} --name github
          --username ${{ secrets.NUGET_USERNAME }} --password ${{ secrets.NUGET_PASSWORD }} --store-password-in-clear-text

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Restore dependencies
        run: dotnet restore ${{ env.CORE_PATH_TO_SLN }}

      - name: Get version from .csproj
        id: version
        run: |
          VERSION=$(xmllint --xpath "string(//Project/PropertyGroup/Version)" ${{ env.CORE_PATH_TO_CSPROJ }})
          echo "CORE_PACKAGE_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build
        run: dotnet build ${{ env.CORE_PATH_TO_SLN }} --configuration Release --no-restore

      - name: Pack NuGet package
        run: >
          dotnet pack ${{ env.CORE_PATH_TO_SLN }} --no-restore --no-build --configuration Release -p:PackageVersion=${{ env.CORE_PACKAGE_VERSION }} -p:PackageId=${{ env.CORE_PACKAGE_NAME }}

      - name: Publish
        run: >
          dotnet nuget push ${{ env.CORE_PROJECT_PATH }}/bin/Release/${{ env.CORE_PACKAGE_NAME }}.${{ env.CORE_PACKAGE_VERSION }}.${{ env.PACKAGE_EXSTENSION_NAME }}
          -s ${{ env.NUGET_SOURCE }}
          
  framework:
    name: Build And Publish Package KinPaws.Framework
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Authenticate with GitHub Packages
        run: >
          dotnet nuget add source
          ${{ secrets.NUGET_SOURCE }} --name github
          --username ${{ secrets.NUGET_USERNAME }} --password ${{ secrets.NUGET_PASSWORD }} --store-password-in-clear-text

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Restore dependencies
        run: dotnet restore ${{ env.FRAMEWORK_PATH_TO_SLN }}

      - name: Get version from .csproj
        id: version
        run: |
          VERSION=$(xmllint --xpath "string(//Project/PropertyGroup/Version)" ${{ env.FRAMEWORK_PATH_TO_CSPROJ }})
          echo "FRAMEWORK_PACKAGE_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build
        run: dotnet build ${{ env.FRAMEWORK_PATH_TO_SLN }} --configuration Release --no-restore

      - name: Pack NuGet package
        run: >
          dotnet pack ${{ env.FRAMEWORK_PATH_TO_SLN }} --no-restore --no-build --configuration Release -p:PackageVersion=${{ env.FRAMEWORK_PACKAGE_VERSION }} -p:PackageId=${{ env.FRAMEWORK_PACKAGE_NAME }}

      - name: Publish
        run: >
          dotnet nuget push ${{ env.FRAMEWORK_PROJECT_PATH }}/bin/Release/${{ env.FRAMEWORK_PACKAGE_NAME }}.${{ env.FRAMEWORK_PACKAGE_VERSION }}.${{ env.PACKAGE_EXSTENSION_NAME }}
          -s ${{ env.NUGET_SOURCE }}
          -k ${{ env.NUGET_PASSWORD }}
    
          -k ${{ env.NUGET_PASSWORD }}