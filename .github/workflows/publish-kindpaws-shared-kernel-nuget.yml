name: KinPaws.SharedKernel

env:
  NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
  NUGET_PASSWORD: ${{ secrets.NUGET_PASSWORD }}
  NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
  DOTNET_VERSION: 8.0.x
  PACKAGE_EXSTENSION_NAME: nupkg
  PROJECT_PATH: ./Shared/KindPaws.SharedKernel
  PATH_TO_SLN: ./Shared/KindPaws.SharedKernel/KindPaws.SharedKernel.sln
  PATH_TO_CSPROJ: ./Shared/KindPaws.SharedKernel/KindPaws.SharedKernel.csproj
  PACKAGE_NAME: KindPaws.SharedKernel

on:
  push:
    branches:
      - Dev
    paths:
      - 'Shared/KindPaws.SharedKernel/KindPaws.SharedKernel.csproj'

jobs:
  sharedkernel:
    name: Build And Publish Package KinPaws.SharedKernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Restore dependencies
        run: dotnet restore ${{ env.PATH_TO_SLN }}

      - name: Get version from .csproj
        id: version
        run: |
          VERSION=$(xmllint --xpath "string(//Project/PropertyGroup/Version)" ${{ env.PATH_TO_CSPROJ }})
          echo "PACKAGE_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build
        run: dotnet build ${{ env.PATH_TO_SLN }} --configuration Release --no-restore

      - name: Pack NuGet package
        run: >
          dotnet pack ${{ env.PATH_TO_SLN }} --no-restore --no-build --configuration Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:PackageId=${{ env.PACKAGE_NAME }}

      - name: Publish
        run: >
          dotnet nuget push ${{ env.PROJECT_PATH }}/bin/Release/${{ env.PACKAGE_NAME }}.${{ env.PACKAGE_VERSION }}.${{ env.PACKAGE_EXSTENSION_NAME }}
          -s ${{ env.NUGET_SOURCE }}
          -k ${{ env.NUGET_PASSWORD }}